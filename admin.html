<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CTI Publishing Console</title><style>body{margin:0;background:#0b0d10;color:#eef2f6;font:15px system-ui}main{max-width:1180px;margin:auto;padding:32px}.top,.toolbar,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:#11151a;border:1px solid #28303a;border-radius:14px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px;color:#aab3bf}input,select,textarea,button{font:inherit}input,select,textarea{box-sizing:border-box;width:100%;background:#0b0e12;color:#eef2f6;border:1px solid #303945;border-radius:8px;padding:10px}textarea{min-height:100px}.body{min-height:280px}button{border:1px solid #394552;background:#171d24;color:#eef2f6;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#0d6066;border-color:#21e6e6}.danger{border-color:#b46a6a}.muted{color:#8f99a7}.status{font:12px ui-monospace,monospace;color:#21e6e6}.list{display:grid;gap:8px;margin-top:14px}.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px;border:1px solid #252c35;border-radius:10px}.hidden{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><div class="status">CTI / GOVERNED PUBLISHING</div><h1>Publishing Console</h1><div class="muted">Blog · Research · Resources · Case Studies · Vendor Intelligence</div></div><button id="logout">Lock</button></div><section class="card" id="auth"><h2>CMS authentication</h2><p class="muted">Enter an editor or admin token. The token stays in browser memory only and is never written to content storage.</p><div class="toolbar"><input id="token" type="password" autocomplete="current-password" placeholder="CMS editor/admin token"><button class="primary" id="unlock">Unlock</button></div></section><section class="card hidden" id="workspace"><div class="toolbar"><button id="newContent">New content</button><button id="newVendor">New vendor</button><button id="refresh">Refresh</button><span id="message" class="status"></span></div><form id="editor"><input id="id" type="hidden"><input id="mode" type="hidden" value="content"><div class="grid"><label>Type<select id="type"><option value="blog">Blog</option><option value="research">Research</option><option value="resource">Resource</option><option value="case-study">Case Study</option><option value="vendor">Vendor Intelligence</option></select></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>Title / Vendor name<input id="title" required maxlength="180"></label><label>Slug<input id="slug" required pattern="[a-z0-9-]+"></label><label>Category<input id="category" maxlength="120"></label><label>Author / Segment<input id="author" maxlength="120"></label></div><label style="margin-top:14px">Summary / Dek<textarea id="dek" maxlength="2000"></textarea></label><label style="margin-top:14px">Body<textarea id="body" class="body" maxlength="50000"></textarea></label><div class="grid" style="margin-top:14px"><label>Topics / Buying triggers (comma separated)<input id="topics"></label><label>Evidence IDs (comma separated)<input id="evidence"></label><label>Source / Website URL<input id="sourceUrl" type="url"></label><label>Hero image URL<input id="heroImage" type="url"></label></div><div class="actions" style="margin-top:18px"><button type="button" id="saveDraft">Save draft</button><button type="button" class="primary" id="publish">Publish</button><button type="button" class="danger" id="archive">Archive</button></div></form><div class="list" id="list"></div></section></main><script src="/CTI_ADMIN_ROLE.js" defer></script><script src="/CTI_ADMIN.js" defer></script></body></html>
