window.fetch = async function(input, init) {
  const url = typeof input === "string" ? input : (input && input.url) || "";
  if (url.includes("/api/intelligence/threats")) {
    try {
      const r = await __ctiNativeFetch("https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json", {cache:"no-store"});

      const vulnerabilities = (d.vulnerabilities || []).slice().sort((a,b)=>String(b.dateAdded||"").localeCompare(String(a.dateAdded||"")));
      const recentCves = vulnerabilities.slice(0, 50).map(v => ({
        id: v.cveID,
        cve: v.cveID,
        title: v.vulnerabilityName,
        vendor: v.vendorProject,
        product: v.product,
        severity: "Known exploited",
        published: v.dateAdded ? v.dateAdded + "T00:00:00Z" : null,
        source: "CISA KEV"
      }));
      return new Response(JSON.stringify({vulnerabilities, recentCves}), {
        status: 200,
        headers: {"Content-Type":"application/json"}
      });
    } catch (e) {
      return new Response(JSON.stringify({error:"Threat feed unavailable"}), {status:503,headers:{"Content-Type":"application/json"}});
    }
  }
  return __ctiNativeFetch(input, init);
};

<style id="cti-conversion-layer-css">
:root{--cti-cyan:#2fd8d4;--cti-bg:#0a0b0d;--cti-panel:#101216;--cti-line:#252a31;--cti-text:#f5f7f8;--cti-muted:#9299a3}
.cti-conv-launch{position:fixed;right:22px;bottom:22px;z-index:9998;display:flex;align-items:center;gap:10px;border:1px solid rgba(47,216,212,.5);background:#101216;color:#fff;border-radius:999px;padding:9px 14px 9px 9px;box-shadow:0 18px 55px rgba(0,0,0,.4);font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.cti-conv-launch-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cti-cyan);color:#031112;font-weight:800}
.cti-conv-panel{position:fixed;right:22px;bottom:82px;z-index:9999;width:min(390px,calc(100vw - 28px));max-height:min(650px,calc(100vh - 110px));overflow:auto;border:1px solid var(--cti-line);border-radius:16px;background:#0c0f13;color:var(--cti-text);box-shadow:0 30px 90px rgba(0,0,0,.55);font-family:Inter,system-ui,sans-serif}
.cti-conv-head{padding:18px 18px 15px;border-bottom:1px solid var(--cti-line);display:flex;justify-content:space-between;gap:14px}
.cti-conv-kicker{font:600 10px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--cti-cyan)}
.cti-conv-title{margin-top:6px;font-size:19px;font-weight:650;letter-spacing:-.02em}
.cti-conv-close{border:0;background:none;color:var(--cti-muted);font-size:22px;cursor:pointer}
.cti-conv-body{padding:18px}
.cti-conv-copy{color:var(--cti-muted);font-size:14px;line-height:1.6;margin:0 0 15px}
.cti-conv-options{display:grid;gap:9px}
.cti-conv-option,.cti-conv-action{width:100%;text-align:left;border:1px solid var(--cti-line);border-radius:9px;background:#101419;color:#eef1f3;padding:12px 13px;cursor:pointer;font:500 14px Inter,system-ui,sans-serif}
.cti-conv-option:hover{border-color:rgba(47,216,212,.65)}
.cti-conv-action.primary{background:var(--cti-cyan);border-color:var(--cti-cyan);color:#041112;font-weight:700;text-align:center}
.cti-conv-action.secondary{text-align:center}
.cti-conv-score{border:1px solid rgba(47,216,212,.28);background:rgba(47,216,212,.05);border-radius:9px;padding:13px;margin:12px 0;color:#aeb6bf;font-size:13px;line-height:1.55}
.cti-conv-privacy{font-size:11px;color:#737b85;line-height:1.5;margin-top:12px}
.cti-call-rail{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:9997;display:none;align-items:center;gap:12px;border:1px solid rgba(47,216,212,.45);background:rgba(12,15,19,.96);backdrop-filter:blur(12px);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:0 18px 55px rgba(0,0,0,.38);font:500 13px Inter,system-ui,sans-serif}
.cti-call-rail strong{color:#fff}.cti-call-rail span{color:#8f97a0}
.cti-call-rail a{background:var(--cti-cyan);color:#031112;border-radius:999px;padding:9px 15px;font-weight:750}
.cti-proof-bridge{max-width:1280px;margin:0 auto;padding:68px 32px;border-top:1px solid #1d2228}
.cti-proof-bridge-inner{display:grid;grid-template-columns:.85fr 1.15fr;gap:44px;align-items:start}
.cti-proof-bridge h2{font:650 clamp(34px,4vw,56px)/1.05 Inter,system-ui,sans-serif;letter-spacing:-.045em;margin:10px 0 16px;color:#f6f7f8}
.cti-proof-bridge p{font:400 17px/1.65 Inter,system-ui,sans-serif;color:#9299a3;margin:0}
.cti-proof-steps{display:grid;gap:1px;background:#252a31;border:1px solid #252a31;border-radius:12px;overflow:hidden}
.cti-proof-step{background:#0d1014;padding:20px;display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start}
.cti-proof-num{font:600 10px "JetBrains Mono",monospace;color:var(--cti-cyan)}
.cti-proof-step strong{display:block;color:#f4f6f7;font:600 15px Inter,system-ui,sans-serif;margin-bottom:4px}
.cti-proof-step span{color:#8f97a0;font:400 13px/1.5 Inter,system-ui,sans-serif}
@media(max-width:760px){.cti-conv-launch{right:12px;bottom:12px}.cti-conv-panel{right:12px;bottom:70px}.cti-call-rail{left:12px;right:12px;transform:none;bottom:12px;border-radius:12px;justify-content:space-between}.cti-call-rail span{display:none}.cti-proof-bridge{padding:52px 20px}.cti-proof-bridge-inner{grid-template-columns:1fr}.cti-conv-launch[data-qualified="true"]{display:none}}
@media(prefers-reduced-motion:reduce){.cti-conv-panel,.cti-conv-launch,.cti-call-rail{scroll-behavior:auto}}
</style>
<script id="cti-conversion-layer-js">
(function(){
  const CONFIG = window.CTI_CONVERSION || {
    buyerPhone:"+16028986394",
    bookingUrl:"",
    crmPath:"/api/website-leads",
    signalPath:"/api/signals",
    qualificationThreshold:70
  };
  const state={score:0,answers:{},step:0,qualified:false};
  const questions=[
    {key:"intent",copy:"What brought you here today?",opts:[
      ["research","Explore cybersecurity intelligence",10],
      ["pipeline","Improve pipeline generation",25],
      ["signals","Activate first-party buyer signals",30],
      ["vendor","Evaluate GTM / vendor intelligence",20]
    ]},
    {key:"role",copy:"Which best describes your role?",opts:[
      ["exec","Founder / CEO / CRO / CMO",30],
      ["revops","Revenue Operations / Demand Gen",25],
      ["sales","Sales / SDR leadership",20],
      ["other","Research / other",5]
    ]},
    {key:"timing",copy:"How soon are you looking to act?",opts:[
      ["now","Now / this quarter",30],
      ["next","Next quarter",20],
      ["later","Exploring for later",5]
    ]}
  ];
  function emit(name,detail={}){
    const payload={schema:"cti.signal.v1",event:{name,ts:new Date().toISOString(),page:location.pathname+location.hash,referrer:document.referrer||null,utm:Object.fromEntries(new URLSearchParams(location.search)),...detail}};
    try{navigator.sendBeacon&&navigator.sendBeacon(CONFIG.signalPath,new Blob([JSON.stringify(payload)],{type:"application/json"}))}catch(e){}
    try{window.dispatchEvent(new CustomEvent("cti:event",{detail:{name,...detail}}))}catch(e){}
  }
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  const launch=document.createElement("button");
  launch.className="cti-conv-launch"; launch.type="button";
  launch.innerHTML='<span class="cti-conv-launch-dot">CTI</span><span>Ask CyberTech Intelligence</span>';
  launch.setAttribute("aria-haspopup","dialog");
  const panel=document.createElement("section");
  panel.className="cti-conv-panel"; panel.hidden=true; panel.setAttribute("role","dialog"); panel.setAttribute("aria-label","CyberTech Intelligence buyer concierge");
  const rail=document.createElement("div"); rail.className="cti-call-rail";
  rail.innerHTML='<div><strong>High-intent buyer path</strong> <span>— speak with CyberTech Intelligence now</span></div><a href="tel:'+CONFIG.buyerPhone+'">Call now</a>';
  document.body.append(launch,panel,rail);
  function render(){
    if(state.step<questions.length){
      const q=questions[state.step];
      panel.innerHTML='<div class="cti-conv-head"><div><div class="cti-conv-kicker">Buyer Concierge</div><div class="cti-conv-title">'+esc(q.copy)+'</div></div><button class="cti-conv-close" aria-label="Close">×</button></div><div class="cti-conv-body"><p class="cti-conv-copy">I’ll route you to research, a GTM review, or a direct conversation based on what you select.</p><div class="cti-conv-options">'+q.opts.map((o,i)=>'<button class="cti-conv-option" data-i="'+i+'">'+esc(o[1])+'</button>').join("")+'</div><div class="cti-conv-privacy">Uses only the commercial context you explicitly select here. No sensitive-trait inference.</div></div>';
      panel.querySelectorAll(".cti-conv-option").forEach(b=>b.onclick=()=>{
        const o=q.opts[+b.dataset.i]; state.answers[q.key]=o[0]; state.score+=o[2]; state.step++; emit("concierge_answer",{question:q.key,answer:o[0]}); render();
      });
    }else{
      state.qualified=state.score>=CONFIG.qualificationThreshold;
      launch.dataset.qualified=state.qualified?"true":"false";
      if(state.qualified) rail.style.display="flex";
      panel.innerHTML='<div class="cti-conv-head"><div><div class="cti-conv-kicker">Buyer Concierge</div><div class="cti-conv-title">'+(state.qualified?'You qualify for a direct GTM conversation.':'Best next step: guided evaluation.')+'</div></div><button class="cti-conv-close" aria-label="Close">×</button></div><div class="cti-conv-body"><div class="cti-conv-score">'+(state.qualified?'Your selections indicate active commercial intent. You can call now or continue to the GTM review form.':'Your selections indicate an exploratory journey. Continue with research or request a GTM review when timing is right.')+'</div><div class="cti-conv-options">'+
      (state.qualified?'<a class="cti-conv-action primary" href="tel:'+CONFIG.buyerPhone+'">Call CyberTech Intelligence now</a>':'')+
      (CONFIG.bookingUrl?'<a class="cti-conv-action primary" href="'+esc(CONFIG.bookingUrl)+'">Book a strategy call</a>':'')+
      '<a class="cti-conv-action secondary" href="/contact.html">Request a GTM Intelligence Review</a><a class="cti-conv-action secondary" href="/research.html">Explore Research</a></div></div>';
      emit("concierge_qualified",{score:state.score,qualified:state.qualified});
    }
    const c=panel.querySelector(".cti-conv-close"); if(c)c.onclick=()=>{panel.hidden=true;emit("concierge_close")};
  }
  launch.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden){render();emit("concierge_open")}};
  rail.querySelector("a").onclick=()=>emit("qualified_call_click",{score:state.score});
  document.addEventListener("click",e=>{
    const a=e.target.closest&&e.target.closest("a,button"); if(!a)return;
    const t=(a.textContent||"").trim().slice(0,120);
    if(t)emit("cta_interaction",{label:t,href:a.getAttribute&&a.getAttribute("href")});
  },true);

  // Frontal-style execution bridge, inserted only on the homepage and only once.
  if(location.pathname==="/" || /index\.html$/.test(location.pathname)){
    const bridge=document.createElement("section"); bridge.className="cti-proof-bridge";
    bridge.innerHTML='<div class="cti-proof-bridge-inner"><div><div class="cti-conv-kicker">Signal → action → pipeline</div><h2>Turn buying movement into routed GTM action.</h2><p>CyberTech Intelligence connects observed first-party engagement to account context, prioritization, SDR action, and attributable pipeline movement. No proof claim is shown here unless it is backed by an approved source.</p></div><div class="cti-proof-steps"><div class="cti-proof-step"><div class="cti-proof-num">01</div><div><strong>Observe</strong><span>Research, pricing, vendor, threat-intel, and campaign engagement.</span></div></div><div class="cti-proof-step"><div class="cti-proof-num">02</div><div><strong>Resolve context</strong><span>Account, topic, buying-group, recency, and source attribution.</span></div></div><div class="cti-proof-step"><div class="cti-proof-num">03</div><div><strong>Qualify & route</strong><span>Server-side qualification determines research, nurture, GTM review, or direct buyer conversation.</span></div></div><div class="cti-proof-step"><div class="cti-proof-num">04</div><div><strong>Learn</strong><span>Pipeline outcomes feed the signal model so each visit improves future prioritization.</span></div></div></div></div>';
    const root=document.getElementById("root");
    if(root) root.insertAdjacentElement("afterend",bridge);
  }
})();
</script>
</body></html>
