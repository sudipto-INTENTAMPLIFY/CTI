name: Monthly Site Evolution Audit

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --if-present
      - name: Audit public routes
        run: npm run audit:routes --if-present
      - name: Audit evidence freshness
        run: npm run audit:evidence --if-present
      - name: Audit signal schema
        run: npm run audit:signals --if-present
      - name: Audit search artifacts
        run: npm run audit:search --if-present
      - name: Audit security controls
        run: npm run audit:security --if-present
      - name: Create monthly review issue
        uses: actions/github-script@v7
        with:
          script: |
            const d = new Date().toISOString().slice(0,7);
            const body = [
              '## Monthly CTI evolution gate',
              '',
              '- [ ] Build/tests reviewed',
              '- [ ] Route/API health reviewed',
              '- [ ] Evidence freshness reviewed',
              '- [ ] Signal/CRM attribution integrity reviewed',
              '- [ ] Search/LLM discoverability reviewed',
              '- [ ] Security/privacy/consent reviewed',
              '- [ ] Device/CWV regression reviewed',
              '- [ ] One bounded improvement proposed with expected metric',
              '- [ ] Staging evidence attached',
              '- [ ] Rollback documented',
              '',
              '**Safety:** this workflow does not modify production, merge code, deploy, activate connectors, or publish claims.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CTI monthly evolution review — ${d}`,
              body,
              labels: ['monthly-evolution']
            });
