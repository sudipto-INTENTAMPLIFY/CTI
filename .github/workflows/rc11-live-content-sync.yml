name: RC11 Live Content Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: RC11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot public production event and campaign surfaces
        run: node scripts/sync-live-content.mjs
      - name: Enforce freshness and source health
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/live-content.json','utf8'));
          if (d.schema !== 'cti.live_content.v1') process.exit(1);
          if (!Array.isArray(d.sources) || d.sources.length < 3) process.exit(1);
          const bad = d.sources.filter(x => x.status !== 'healthy');
          if (bad.length) { console.error('Degraded live-content sources:', bad.map(x => x.id)); process.exit(1); }
          const age = Date.now() - Date.parse(d.generatedAt);
          if (!Number.isFinite(age) || age > 36*60*60*1000) process.exit(1);
          console.log('Live campaign/event content evidence PASS');
          NODE
      - name: Commit refreshed snapshot when changed
        run: |
          if git diff --quiet -- data/live-content.json; then
            echo 'No live-content changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live-content.json
          git commit -m 'chore(rc11): refresh live campaign content snapshot'
          git push origin HEAD:RC11
